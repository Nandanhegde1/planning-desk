# Render Blueprint: New > Blueprint, pick this repository, paste the two keys.
# A free web service: 512 MB, one instance, asleep after 15 idle minutes.
# HOSTING.md has the rest.
services:
  - type: web
    name: planning-desk
    runtime: docker
    plan: free
    region: singapore
    # Liveness only. /api/health answers 503 while a key is missing, which is a
    # setting to fix, not a container to restart.
    healthCheckPath: /api/health/live
    autoDeployTrigger: commit
    envVars:
      # Asked for once, when the Blueprint is created.
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TEMPERATURE
        value: "1"
      - key: LLM_REASONING_EFFORT
        value: low
      - key: SEARCH_PROVIDER
        value: tavily
      - key: DAILY_TURN_CAP
        value: "100"
      - key: PUBLIC_NOTICE
        value: Runs on a free model tier that may use what you type for training. Do not enter personal details.
      # Nominatim asks every caller to identify itself.
      - key: HTTP_USER_AGENT
        value: planning-desk/1.0 (+https://github.com/Nandanhegde1/planning-desk)
