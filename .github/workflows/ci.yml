name: CI

# The same two gates as a local run. Render deploys every push to main on its
# own, so this does not hold a deploy back: it reports a broken commit.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app core servers tests
      # No secrets are set here, and the suite does not need any.
      - run: python -m pytest -q
